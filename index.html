<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Tracker</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="add-transaction-btn" class="btn btn-primary">+ Add Transaction</button>
    </div>

    <div id="add-transaction-form" class="form-panel" style="display:none">
      <h3>Add Transaction</h3>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="tx-date">
      </div>
      <div class="form-row">
        <label>Platform</label>
        <div class="combo-row">
          <select id="tx-platform"></select>
          <input type="text" id="new-platform" placeholder="New platform...">
        </div>
      </div>
      <div class="form-row">
        <label>Asset</label>
        <div class="combo-row">
          <select id="tx-asset"></select>
          <input type="text" id="new-asset" placeholder="New asset...">
        </div>
      </div>
      <div class="form-row">
        <label>Amount</label>
        <input type="number" id="tx-amount" min="0" step="any" placeholder="500">
      </div>
      <div class="form-row">
        <label>Currency</label>
        <div class="combo-row">
          <select id="tx-currency"></select>
          <input type="text" id="new-currency" placeholder="New currency...">
        </div>
      </div>
      <div class="form-row">
        <label>Notes</label>
        <input type="text" id="tx-notes" placeholder="Optional notes...">
      </div>
      <div class="form-actions">
        <button id="save-transaction" class="btn btn-primary">Save</button>
        <button id="cancel-transaction" class="btn btn-ghost">Cancel</button>
      </div>
    </div>

    <div id="summary-section">
      <div id="summary-pills"></div>
    </div>

    <div id="transactions-section">
      <h2>Transactions</h2>
      <table id="transactions-table">
        <thead>
          <tr><th>Date</th><th>Platform</th><th>Asset</th><th>Amount</th><th>Currency</th><th>Notes</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
